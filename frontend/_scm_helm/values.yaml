# Default values for aiops.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: "aiopscr.azurecr.io/docker/aiops-iabot-web"
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets:
  - name: aiops-registry

## environmental variables to pods (name and value)
envVariables: []
  # - name: APP_TITLE
  #   value: "aiops API"
  # - name: XYZ
  #   value: "123"

pvc:
  enabled: false
  accessMode: ReadWriteOnce
  size: 1Gi
  provisioner: kubernetes.io/azure-disk
  mountPath: /mnt/data

container:
  name: http
  port: 80

service:
  type: ClusterIP
  port: 80
# Liveness probe configuration
# livenessProbe: |
#   httpGet:
#     path: /api/code_assist
#     port: http
#   initialDelaySeconds: 0
#   timeoutSeconds: 5  

# Readiness probe configuration
# readinessProbe: |
#   httpGet:
#     path: /api/code_assist/
#     port: http
#   initialDelaySeconds: 30
#   timeoutSeconds: 1

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

ingress:
  enabled: false
  className: "nginx"
  annotations: {
    nginx.ingress.kubernetes.io/add-base-url: "true",
    nginx.ingress.kubernetes.io/client-body-buffer-size: 100m,
    nginx.ingress.kubernetes.io/proxy-body-size: 100m,
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "3600",
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600",
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600",
    nginx.ingress.kubernetes.io/rewrite-target: /$1,
    nginx.ingress.kubernetes.io/server-snippet: keepalive_timeout 3600s;client_header_timeout
      3600s;client_body_timeout 3600s;,
    nginx.ingress.kubernetes.io/use-regex: "true"
  }
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: ""
      paths:
        - path: /(.*)                 # path to the service if the service was frontend the path should be / if the service was backend the path should be /<api or backend>/(.*)
          pathType: Prefix
          backend: 
            service: aiops
            port:
              number: 80
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

